<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>生地サンプル リクエスト</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mony&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f5;--bg1:#f4f0ea;--bg2:#ece7de;--bg3:#e4ddd2;
  --line:#d0c8bc;--line2:#c0b8ac;
  --txt:#2c2824;--txt2:#4a4038;--txt3:#9a9088;
  --gold:#7a6a5a;--gold-d:#5a4a3a;--gold-lo:#7a6a5a22;
  --red:#c0392b;--green:#4a7a60;
  --r:0px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100%;background:var(--bg);color:var(--txt);
  font-family:'Inter','Helvetica Neue',Arial,sans-serif;
  font-size:13px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
body{padding:0 0 60px;position:relative}

/* corner marks */
.corner-tl,.corner-tr,.corner-bl,.corner-br{
  position:fixed;width:14px;height:14px;z-index:100;opacity:.35;
}
.corner-tl{top:10px;left:10px;border-top:1px solid var(--gold);border-left:1px solid var(--gold)}
.corner-tr{top:10px;right:10px;border-top:1px solid var(--gold);border-right:1px solid var(--gold)}
.corner-bl{bottom:10px;left:10px;border-bottom:1px solid var(--gold);border-left:1px solid var(--gold)}
.corner-br{bottom:10px;right:10px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold)}

/* Header */
.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--bg1);border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.hdr::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.4;
}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-mark{
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);position:relative;flex-shrink:0;
}
.hdr-mark::before{
  content:'';position:absolute;
  width:12px;height:12px;
  border:1px solid var(--gold);
  transform:rotate(45deg);
}
.hdr-title{font-size:10px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;font-family:'Share Tech Mono',monospace;}
.hdr-sub{font-size:8px;letter-spacing:.2em;color:var(--txt3);margin-top:2px;font-family:'Share Tech Mono',monospace;}
.hdr-id{font-size:9px;letter-spacing:.1em;color:var(--txt3);font-family:'Share Tech Mono',monospace;}

.wrap{max-width:460px;margin:0 auto;padding:28px 20px}

/* Divider */
.div-lbl{
  font-size:8px;letter-spacing:.28em;color:var(--txt3);text-transform:uppercase;
  margin-bottom:16px;display:flex;align-items:center;gap:12px;
  font-family:'Share Tech Mono',monospace;
}
.div-lbl::before{content:'▸';color:var(--gold);font-size:8px}
.div-lbl::after{content:'';flex:1;height:1px;background:var(--line)}

/* Fabric card */
.fabric-card{
  background:var(--bg2);border:1px solid var(--line);
  padding:18px 20px;margin-bottom:28px;position:relative;
}
.fabric-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.6;
}
.fabric-card::after{
  content:'SPECIMEN';position:absolute;top:10px;right:14px;
  font-size:8px;letter-spacing:.25em;color:var(--txt3);opacity:.5;
  font-family:'Share Tech Mono',monospace;
}
.fabric-code{
  color:var(--gold);font-size:19px;letter-spacing:.06em;
  margin-bottom:3px;font-family:'Share Tech Mono',monospace;
}
.fabric-name{font-size:12px;color:var(--txt2);margin-bottom:16px;}
.fabric-specs{
  display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;
  border-top:1px solid var(--line);padding-top:14px;
}
.spec-lbl{font-size:8px;letter-spacing:.2em;color:var(--txt3);text-transform:uppercase;margin-bottom:3px;font-family:'Share Tech Mono',monospace;}
.spec-val{font-size:12px;color:var(--txt)}

/* Form */
.inp-row{margin-bottom:14px}
.inp-lbl{display:block;font-size:8px;letter-spacing:.2em;color:var(--txt3);text-transform:uppercase;margin-bottom:7px;}
.inp-lbl .req{color:var(--red);margin-left:3px}
.inp{
  width:100%;background:transparent;
  border:none;border-bottom:1px solid var(--line2);
  color:var(--txt);font-size:13px;font-family:inherit;
  padding:8px 0;outline:none;transition:border-color .15s;
  border-radius:0;-webkit-appearance:none;appearance:none;
}
.inp:focus{border-bottom-color:var(--gold)}
.inp::placeholder{color:var(--txt3)}
textarea.inp{
  border:1px solid var(--line2);padding:8px 10px;background:var(--bg2);
  resize:vertical;min-height:72px;
}
textarea.inp:focus{border-color:var(--gold)}

/* Submit */
.btn-submit{
  display:block;width:100%;padding:13px 0;
  background:transparent;border:1px solid var(--line2);
  color:var(--gold);font-size:10px;font-family:'Share Tech Mono',monospace;
  letter-spacing:.35em;text-transform:uppercase;cursor:pointer;
  position:relative;overflow:hidden;transition:all .2s;margin-top:10px;
}
.btn-submit::before{
  content:'';position:absolute;inset:0;
  background:var(--gold);opacity:0;transition:opacity .2s;
}
.btn-submit:hover{color:var(--bg);border-color:var(--gold)}
.btn-submit:hover::before{opacity:1}
.btn-submit span{position:relative;z-index:1}
.btn-submit:active{transform:scale(.99)}
.btn-submit:disabled{opacity:.35;cursor:not-allowed}
.btn-submit:disabled::before{opacity:0}

/* States */
#screen-form{display:block}
#screen-sending,#screen-done,#screen-error,#screen-nodata{display:none;text-align:center;padding:70px 20px;}
.state-ic{
  width:44px;height:44px;margin:0 auto 22px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);font-size:20px;
}
.state-ttl{font-size:14px;letter-spacing:.1em;margin-bottom:10px;color:var(--txt);font-family:'Share Tech Mono',monospace;}
.state-sub{font-size:11px;color:var(--txt3);line-height:2}

.spinner{width:30px;height:30px;border:1px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.cursor{animation:blink 1s step-end infinite}

.banner-warn{background:var(--bg2);border:1px solid var(--line2);padding:13px 16px;margin-bottom:20px;font-size:11px;color:var(--txt2);display:flex;gap:12px;align-items:flex-start;}
.banner-warn-ic{color:var(--gold);flex-shrink:0}
.req-note{font-size:8px;color:var(--txt3);letter-spacing:.1em;margin-bottom:20px;font-family:'Share Tech Mono',monospace;}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--line)}
</style>
</head>
<body>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzx0gmi0STYTe1KGkrACy6jqou2nNVhylQmbn6MHOaM7CInEOgz-mxlKDlKFPQI2N6B/exec';
</script>

<div class="corner-tl"></div><div class="corner-tr"></div>
<div class="corner-bl"></div><div class="corner-br"></div>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-mark"></div>
    <div>
      <div class="hdr-title">FabricQR</div>
      <div class="hdr-sub">Sample Request System</div>
    </div>
  </div>
  <div class="hdr-id" id="hdr-id">— — —</div>
</div>

<div class="wrap">

  <div id="screen-nodata">
    <div class="state-ic" style="color:var(--txt3)">✕</div>
    <div class="state-ttl">No Data</div>
    <div class="state-sub">QRコードを読み取ってください<br>Scan QR code to load fabric data</div>
  </div>

  <div id="screen-form">
    <div class="fabric-card" id="fabric-info">
      <div class="fabric-code" id="f-hinban">———</div>
      <div class="fabric-name" id="f-hinmei"></div>
      <div class="fabric-specs" id="f-specs"></div>
    </div>

    <div class="banner-warn" id="no-endpoint-warn" style="display:none">
      <span class="banner-warn-ic">!</span>
      <div>エンドポイントURLが未設定です。送信できません。</div>
    </div>

    <div class="div-lbl">Client Info</div>
    <div class="inp-row">
      <label class="inp-lbl">お名前<span class="req">*</span></label>
      <input type="text" class="inp" id="r-name" placeholder="山田 太郎" autocomplete="name">
    </div>
    <div class="inp-row">
      <label class="inp-lbl">会社名</label>
      <input type="text" class="inp" id="r-company" placeholder="株式会社〇〇" autocomplete="organization">
    </div>
    <div class="inp-row">
      <label class="inp-lbl">電話番号</label>
      <input type="tel" class="inp" id="r-tel" placeholder="03-0000-0000" autocomplete="tel">
    </div>
    <div class="inp-row">
      <label class="inp-lbl">メールアドレス</label>
      <input type="email" class="inp" id="r-email" placeholder="your@email.com" autocomplete="email">
    </div>

    <div class="div-lbl" style="margin-top:24px">Request</div>
    <div class="inp-row">
      <label class="inp-lbl">部数<span class="req">*</span></label>
      <input type="number" class="inp" id="r-qty" min="1" step="1" placeholder="1">
    </div>
    <div class="inp-row">
      <label class="inp-lbl">メモ・備考</label>
      <textarea class="inp" id="r-memo" placeholder="補足情報をご記入ください"></textarea>
    </div>
    <div class="req-note"><span style="color:var(--red)">*</span> required field</div>

    <button class="btn-submit" id="btn-submit" onclick="submitForm()">
      <span>送信する / Submit<span class="cursor">_</span></span>
    </button>
  </div>

  <div id="screen-sending">
    <div class="spinner"></div>
    <div class="state-ttl">Processing<span class="cursor">_</span></div>
    <div class="state-sub">送信中です。しばらくお待ちください</div>
  </div>

  <div id="screen-done">
    <div class="state-ic" style="border-color:var(--green);color:var(--green)">✓</div>
    <div class="state-ttl">Complete</div>
    <div class="state-sub">リクエストを受け付けました<br>担当者よりご連絡いたします</div>
  </div>

  <div id="screen-error">
    <div class="state-ic" style="border-color:var(--red);color:var(--red)">✕</div>
    <div class="state-ttl">Error</div>
    <div class="state-sub" id="err-msg">送信に失敗しました</div>
    <button onclick="showScreen('form')" style="margin-top:28px;padding:9px 28px;background:transparent;color:var(--txt2);border:1px solid var(--line);font-size:9px;letter-spacing:.25em;cursor:pointer;font-family:'Share Tech Mono',monospace;">RETRY</button>
  </div>

</div>

<script>
'use strict';
const params = new URLSearchParams(location.search);
const fabric = {hinban:params.get('id')||'',hinmei:params.get('nm')||'',haba:params.get('w')||'',me:params.get('g')||'',konritsu:params.get('k')||'',ito:params.get('t')||''};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function showScreen(n){['form','sending','done','error','nodata'].forEach(s=>{document.getElementById('screen-'+s).style.display=s===n?'block':'none';});}
function init(){
  if(!fabric.hinban){showScreen('nodata');return;}
  document.getElementById('hdr-id').textContent=fabric.hinban;
  document.getElementById('f-hinban').textContent=fabric.hinban;
  document.getElementById('f-hinmei').textContent=fabric.hinmei||'';
  const specs=[];
  if(fabric.haba)specs.push(['生地巾',fabric.haba]);
  if(fabric.me)specs.push(['目付',fabric.me]);
  if(fabric.konritsu)specs.push(['混率',fabric.konritsu]);
  if(fabric.ito)specs.push(['使用糸',fabric.ito]);
  document.getElementById('f-specs').innerHTML=specs.map(([l,v])=>'<div><div class="spec-lbl">'+esc(l)+'</div><div class="spec-val">'+esc(v)+'</div></div>').join('');
  if(!ENDPOINT){document.getElementById('no-endpoint-warn').style.display='flex';document.getElementById('btn-submit').disabled=true;}
  showScreen('form');
}
async function submitForm(){
  const name=(document.getElementById('r-name').value||'').trim();
  const qty=parseFloat(document.getElementById('r-qty').value)||0;
  if(!name){const el=document.getElementById('r-name');el.focus();el.style.borderColor='var(--red)';setTimeout(()=>el.style.borderColor='',1500);return;}
  if(!qty||qty<=0){const el=document.getElementById('r-qty');el.focus();el.style.borderColor='var(--red)';setTimeout(()=>el.style.borderColor='',1500);return;}
  const payload={hinban:fabric.hinban,hinmei:fabric.hinmei,haba:fabric.haba,me:fabric.me,konritsu:fabric.konritsu,ito:fabric.ito,name,company:(document.getElementById('r-company').value||'').trim(),tel:(document.getElementById('r-tel').value||'').trim(),email:(document.getElementById('r-email').value||'').trim(),qty,memo:(document.getElementById('r-memo').value||'').trim()};
  showScreen('sending');
  try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});showScreen('done');}
  catch(e){document.getElementById('err-msg').textContent=e.message||'ネットワークエラーが発生しました';showScreen('error');}
}
init();
</script>
</body>
</html>
