<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>生地サンプル リクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink-0:#050505;--ink-1:#0c0c0c;--ink-2:#131313;--ink-3:#1a1a1a;
  --ink-4:#222222;--ink-5:#2c2c2c;--ink-6:#383838;--ink-7:#4a4a4a;
  --sand-1:#f0ece6;--sand-2:#c4bcb2;--sand-3:#857d73;--sand-4:#514840;
  --gold:#C8A84A;--gold-hi:#E4C46A;--gold-lo:#A08830;
  --gold-10:rgba(200,168,74,.10);--gold-18:rgba(200,168,74,.18);
  --gold-30:rgba(200,168,74,.30);
  --ruby:#B85448;--ruby-10:rgba(184,84,72,.10);--ruby-30:rgba(184,84,72,.30);
  --sage:#6A9E82;--sage-10:rgba(106,158,130,.10);
  --r:5px;--rl:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100%;background:var(--ink-0);color:var(--sand-1);
  font-family:'Inter','Helvetica Neue',Arial,'Hiragino Sans','Yu Gothic UI',sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
body{padding:0 0 60px}

/* Header */
.hdr{
  position:sticky;top:0;z-index:10;
  background:var(--ink-1);border-bottom:1px solid var(--ink-4);
  padding:16px 20px;display:flex;align-items:center;gap:14px;
  backdrop-filter:blur(8px);
}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-brand{font-size:12px;font-weight:300;letter-spacing:.28em}
.hdr-brand em{font-style:normal;color:var(--gold);font-weight:600}
.hdr-sub{font-size:8px;letter-spacing:.22em;color:var(--ink-7);text-transform:uppercase;margin-top:1px}

.wrap{max-width:480px;margin:0 auto;padding:24px 20px}

/* Fabric info card */
.fabric-card{
  background:var(--ink-2);border:1px solid var(--ink-4);
  border-radius:var(--rl);padding:20px;margin-bottom:24px;
  position:relative;overflow:hidden;
}
.fabric-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-lo));
}
.fabric-code{
  font-family:'SF Mono','Fira Code','Consolas',monospace;
  color:var(--gold);font-size:18px;font-weight:500;letter-spacing:.05em;
  margin-bottom:4px;
}
.fabric-name{font-size:13px;color:var(--sand-2);margin-bottom:14px}
.fabric-specs{
  display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;
}
.spec-item{}
.spec-lbl{font-size:9.5px;font-weight:600;letter-spacing:.16em;color:var(--ink-7);text-transform:uppercase;margin-bottom:2px}
.spec-val{font-size:12.5px;color:var(--sand-1)}

/* Form */
.section-ttl{
  font-size:9px;font-weight:600;letter-spacing:.22em;color:var(--ink-7);
  text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;
}
.section-ttl::after{content:'';flex:1;height:1px;background:var(--ink-4)}
.inp-row{margin-bottom:14px}
.inp-lbl{
  display:block;font-size:10px;font-weight:600;letter-spacing:.16em;
  color:var(--sand-3);text-transform:uppercase;margin-bottom:7px;
}
.inp-lbl .req{color:var(--ruby);margin-left:2px}
.inp{
  width:100%;background:var(--ink-3);border:1px solid var(--ink-5);
  border-radius:var(--r);color:var(--sand-1);font-size:14px;font-family:inherit;
  padding:10px 14px;outline:none;transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;appearance:none;
}
.inp:focus{border-color:var(--gold-30);box-shadow:0 0 0 3px var(--gold-10)}
.inp::placeholder{color:var(--ink-7)}
textarea.inp{resize:vertical;min-height:80px}

/* Submit button */
.btn-submit{
  display:block;width:100%;padding:14px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-hi) 100%);
  color:#000;font-size:14px;font-weight:600;letter-spacing:.08em;
  border:none;border-radius:var(--r);cursor:pointer;font-family:inherit;
  box-shadow:0 2px 16px rgba(200,168,74,.30);
  transition:all .15s;margin-top:8px;
}
.btn-submit:hover{
  background:linear-gradient(135deg,var(--gold-hi) 0%,var(--gold) 100%);
  box-shadow:0 4px 22px rgba(200,168,74,.45);transform:translateY(-1px);
}
.btn-submit:active{transform:translateY(0)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* States */
#screen-form{display:block}
#screen-sending{display:none;text-align:center;padding:60px 20px}
#screen-done{display:none;text-align:center;padding:60px 20px}
#screen-error{display:none;text-align:center;padding:60px 20px}
#screen-nodata{display:none;text-align:center;padding:60px 20px}

.state-ic{font-size:44px;margin-bottom:18px}
.state-ttl{font-size:18px;font-weight:300;letter-spacing:.04em;margin-bottom:10px}
.state-sub{font-size:13px;color:var(--sand-3)}

.spinner{
  width:36px;height:36px;border:2px solid var(--ink-5);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 20px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* No-config banner */
.banner-warn{
  background:var(--ink-2);border:1px solid var(--gold-30);border-radius:var(--rl);
  padding:16px 18px;margin-bottom:20px;font-size:12.5px;color:var(--sand-3);
  display:flex;gap:12px;align-items:flex-start;
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--ink-5);border-radius:2px}
</style>
</head>
<body>

<!-- ── IMPORTANT: Set ENDPOINT to your Google Apps Script URL ── -->
<script>
// ▼▼▼ GASデプロイURL をここに入力してください ▼▼▼
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzx0gmi0STYTe1KGkrACy6jqou2nNVhylQmbn6MHOaM7CInEOgz-mxlKDlKFPQI2N6B/exec';
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
</script>

<!-- Header -->
<div class="hdr">
  <div class="hdr-logo">
    <svg width="28" height="28" viewBox="0 0 34 34" fill="none">
      <polygon points="17,3 31,17 17,31 3,17" stroke="#C8A84A" stroke-width="1.2" fill="none"/>
      <polygon points="17,9 25,17 17,25 9,17" fill="#C8A84A" fill-opacity="0.18"/>
      <polygon points="17,13 21,17 17,21 13,17" fill="#C8A84A" fill-opacity="0.55"/>
    </svg>
    <div>
      <div class="hdr-brand">FABRIC<em>QR</em></div>
      <div class="hdr-sub">Sample Request</div>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- No data screen -->
  <div id="screen-nodata">
    <div class="state-ic" style="color:var(--ink-6)">&#x22A0;</div>
    <div class="state-ttl">QRコードから開いてください</div>
    <div class="state-sub">このページはQRコードを読み込むと<br>生地情報が表示されます</div>
  </div>

  <!-- Form screen -->
  <div id="screen-form">

    <!-- Fabric info -->
    <div class="fabric-card" id="fabric-info">
      <div class="fabric-code" id="f-hinban">---</div>
      <div class="fabric-name" id="f-hinmei"></div>
      <div class="fabric-specs" id="f-specs"></div>
    </div>

    <!-- No endpoint warning -->
    <div class="banner-warn" id="no-endpoint-warn" style="display:none">
      <span style="color:var(--gold);font-size:16px">&#x26A0;</span>
      <div>このページにエンドポイントURLが設定されていません。<br>送信先が未設定のため送信できません。</div>
    </div>

    <!-- Request form -->
    <div class="section-ttl">お客様情報</div>

    <div class="inp-row">
      <label class="inp-lbl">お名前 <span class="req">*</span></label>
      <input type="text" class="inp" id="r-name" placeholder="山田 太郎" autocomplete="name">
    </div>
    <div class="inp-row">
      <label class="inp-lbl">会社名</label>
      <input type="text" class="inp" id="r-company" placeholder="株式会社〇〇" autocomplete="organization">
    </div>
    <div class="inp-row">
      <label class="inp-lbl">電話番号</label>
      <input type="tel" class="inp" id="r-tel" placeholder="03-0000-0000" autocomplete="tel">
    </div>
    <div class="inp-row">
      <label class="inp-lbl">メールアドレス</label>
      <input type="email" class="inp" id="r-email" placeholder="your@email.com" autocomplete="email">
    </div>

    <div class="section-ttl" style="margin-top:22px">リクエスト内容</div>

    <div class="inp-row">
      <label class="inp-lbl">数量（m） <span class="req">*</span></label>
      <input type="number" class="inp" id="r-qty" min="0.1" step="0.1" placeholder="1.0">
    </div>
    <div class="inp-row">
      <label class="inp-lbl">メモ・備考</label>
      <textarea class="inp" id="r-memo" placeholder="ご要望やカラー等の補足情報をご記入ください"></textarea>
    </div>

    <div class="inp-row" style="color:var(--sand-4);font-size:11px;margin-bottom:20px">
      <span class="req">*</span> は必須項目です
    </div>

    <button class="btn-submit" id="btn-submit" onclick="submitForm()">送信する</button>

  </div><!-- /screen-form -->

  <!-- Sending -->
  <div id="screen-sending">
    <div class="spinner"></div>
    <div class="state-ttl">送信中...</div>
    <div class="state-sub">しばらくお待ちください</div>
  </div>

  <!-- Done -->
  <div id="screen-done">
    <div class="state-ic" style="color:var(--sage)">&#x2713;</div>
    <div class="state-ttl">送信しました</div>
    <div class="state-sub">リクエストを受け付けました。<br>担当者よりご連絡いたします。</div>
  </div>

  <!-- Error -->
  <div id="screen-error">
    <div class="state-ic" style="color:var(--ruby)">&#x2715;</div>
    <div class="state-ttl">送信に失敗しました</div>
    <div class="state-sub" id="err-msg">もう一度お試しください</div>
    <button onclick="showScreen('form')" style="margin-top:24px;padding:10px 24px;background:var(--ink-4);color:var(--sand-1);border:1px solid var(--ink-5);border-radius:var(--r);font-size:13px;cursor:pointer;font-family:inherit">戻る</button>
  </div>

</div><!-- /wrap -->

<script>
'use strict';

// ── Parse URL params ──
const params = new URLSearchParams(location.search);
const fabric = {
  hinban:   params.get('id') || '',
  hinmei:   params.get('nm') || '',
  haba:     params.get('w')  || '',
  me:       params.get('g')  || '',
  konritsu: params.get('k')  || '',
  ito:      params.get('t')  || '',
};

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showScreen(name) {
  ['form','sending','done','error','nodata'].forEach(s => {
    document.getElementById('screen-' + s).style.display = s === name ? (s==='form'?'block':'block') : 'none';
  });
}

// ── Init ──
function init() {
  if (!fabric.hinban) {
    showScreen('nodata');
    return;
  }

  // Fill fabric card
  document.getElementById('f-hinban').textContent = fabric.hinban;
  document.getElementById('f-hinmei').textContent = fabric.hinmei || '';

  const specs = [];
  if (fabric.haba)     specs.push(['生地巾', fabric.haba]);
  if (fabric.me)       specs.push(['目付',   fabric.me]);
  if (fabric.konritsu) specs.push(['混率',   fabric.konritsu]);
  if (fabric.ito)      specs.push(['使用糸', fabric.ito]);

  document.getElementById('f-specs').innerHTML = specs.map(([l, v]) =>
    '<div class="spec-item"><div class="spec-lbl">'+esc(l)+'</div><div class="spec-val">'+esc(v)+'</div></div>'
  ).join('');

  // Warn if no endpoint
  if (!ENDPOINT) {
    document.getElementById('no-endpoint-warn').style.display = 'flex';
    document.getElementById('btn-submit').disabled = true;
  }

  showScreen('form');
}

// ── Submit ──
async function submitForm() {
  const name = (document.getElementById('r-name').value || '').trim();
  const qty  = parseFloat(document.getElementById('r-qty').value) || 0;

  if (!name) {
    document.getElementById('r-name').focus();
    document.getElementById('r-name').style.borderColor = 'var(--ruby)';
    setTimeout(() => document.getElementById('r-name').style.borderColor = '', 1500);
    return;
  }
  if (!qty || qty <= 0) {
    document.getElementById('r-qty').focus();
    document.getElementById('r-qty').style.borderColor = 'var(--ruby)';
    setTimeout(() => document.getElementById('r-qty').style.borderColor = '', 1500);
    return;
  }

  const payload = {
    hinban:   fabric.hinban,
    hinmei:   fabric.hinmei,
    haba:     fabric.haba,
    me:       fabric.me,
    konritsu: fabric.konritsu,
    ito:      fabric.ito,
    name,
    company:  (document.getElementById('r-company').value || '').trim(),
    tel:      (document.getElementById('r-tel').value || '').trim(),
    email:    (document.getElementById('r-email').value || '').trim(),
    qty,
    memo:     (document.getElementById('r-memo').value || '').trim(),
  };

  showScreen('sending');

  try {
    // GAS doesn't support CORS preflight on POST — use no-cors + assume success
    await fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    // no-cors means we can't read the response; treat as success
    showScreen('done');
  } catch(e) {
    document.getElementById('err-msg').textContent = e.message || 'ネ�
